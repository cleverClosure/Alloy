# Alloy Swift lint policy — Author: Tim Isaev
# Dormant until the first .swift file lands (tools/lint.sh activates it
# automatically).  Applies to the Alloy.app codebase; keep rules additive.
excluded:
  - third_party
  - tools/toolchains
  - spikes/*/work

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  max_length: 60

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 900

trailing_whitespace:
  ignores_empty_lines: false
