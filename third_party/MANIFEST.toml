# Alloy pinned upstream dependencies
# Author: Tim Isaev
#
# Committed: this manifest + deps.lock (exact commits/versions, written by tools/fetch-deps.sh).
# Not committed: third_party/src/* checkouts, downloaded toolchains.
# Policy (docs 11 §17): every external dependency carries owner, pinned revision, license,
# redistribution class (per docs/research/SPIKE-LEGAL-001-preliminary-findings.md §2),
# upstream relationship, and replacement plan. Nothing stays "latest main" in stable generations.

[fex]
role = "Production CPU translation candidate (x64 -> ARM64, ARM64EC integration) — SPIKE-CPU-001"
upstream = "https://github.com/FEX-Emu/FEX.git"
license = "MIT"
distribution_class = "BUNDLE"
notes = "macOS host is unsupported upstream; the spike ports minimum host abstractions. Upstream-contribution strategy per ADR-0005 before any public fork."

[wine]
role = "Windows API layer (thin fork; ARM64 native + ARM64EC/WoW64) — SPIKE-WINE-001"
upstream = "https://gitlab.winehq.org/wine/wine.git"
license = "LGPL-2.1-or-later"
distribution_class = "BUNDLE (public fork + diffs per release; dynamic boundary)"
notes = "Compliance model per docs/docs/18 (CrossOver pattern). Fork repo is created when the first patch lands; until then this is a read/build checkout."

[llvm-mingw]
role = "PE cross-toolchain for Wine (aarch64 + arm64ec targets; Apple mingw-w64 brew package is x86-only)"
upstream = "https://github.com/mstorsjo/llvm-mingw"
license = "Apache-2.0 WITH LLVM-exception (toolchain); runtime libs various permissive"
distribution_class = "Build tooling only (not shipped)"
notes = "Fetched as a release binary into tools/toolchains/; exact release recorded in deps.lock."

[dxc]
role = "HLSL -> DXIL compiler, used as an unmodified tool to produce the shader path's input — SPIKE-M12-003, SPIKE-M12-005"
upstream = "https://github.com/microsoft/DirectXShaderCompiler"
license = "NCSA (University of Illinois/NCSA Open Source License)"
distribution_class = "Build tooling only (not shipped)"
notes = "Pinned to release v1.9.2602.24, asset dxc_2026_05_27.zip, extracted to tools/toolchains/dxc-v1.9.2602.24/. The x64 dxc.exe runs under Alloy's own Wine/FEX stack. Pinned to an exact tag, not latest: its output is compared against committed image digests, so a silent compiler bump reads as a translation regression. Upstream publishes no checksum with the release, so the binding pin is the dxc.exe SHA-256 in deps.lock. ADR-0012: approved input, used as a tool only — no DXC source is read for design. Replacement plan: none needed while it stays a build-time tool; if a shipped compiler is ever required, the NCSA terms already permit redistribution."

[dxmt]
role = "D3D10/11 -> Metal provider (fork) — SPIKE-GFX-001"
upstream = "https://github.com/3Shain/dxmt.git"
license = "LGPL-2.1-or-later (> v0.80; MIT at and before v0.80); pinned checkout LICENSE confirms LGPL (CodeWeavers)"
distribution_class = "BUNDLE (public fork + source per release; dynamic boundary)"
notes = "Fetched 2026-07-24 (PROVENANCE.log). ADR-0012 exclusion guard is STANDING: src/d3d12/ is deleted at clone time by fetch-deps.sh, before any human or AI reads the tree, and must never be restored or read; meson enable_d3d12 stays off. Native build deps: brew llvm@15 (airconv AIR emission), meson/ninja."
