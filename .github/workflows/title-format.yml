# Keep shaped issue titles uniform on lists, boards, and branches.
# Author: Timur Isaev
#
# The Task form's Area and Priority choices are applied as labels first, in the
# same job, because the title's domain comes from the first area label. Two
# workflows would race, and labels added with the Actions token start no new
# run that could catch the title up afterwards.

name: Title format

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: title-format-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize issue title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # `issues` workflows execute from the default branch, so this checks out
      # trusted code rather than content supplied by the issue author.
      - name: Check out normalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script's awk program is tested in CI on macOS. This runner's awk is
      # a different implementation, so it proves itself here before it is
      # allowed to rewrite an issue.
      - name: Task form self-test on this runner
        run: bash .github/workflows/task-form.sh --selftest

      - name: Apply the Task form's Area and Priority as labels
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/workflows/task-form.sh

      - name: Normalize title
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/workflows/title-format.sh
