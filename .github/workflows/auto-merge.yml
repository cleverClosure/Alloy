# Alloy automatic merge on green CI and CodeQL
# Author: Timur Isaev
#
# Every non-draft pull request into main squash-merges itself as soon as CI is
# green. There is no label gate: opening a PR is the decision to merge it. If a
# PR needs a human call before landing, open it as a draft (or convert it back
# to draft) - drafts are skipped and re-evaluated when marked ready, because
# ci.yml runs on ready_for_review.
#
# Main now has free public-repository branch rules requiring CI and CodeQL.
# Keep this workflow because it also enforces the board's Estimate/Actual gate.
# Either analysis may finish last, so both completions must trigger evaluation.
#
# NOTE: workflow_run only fires for workflow files that exist on the default
# branch, so this file does nothing until it is on main.
#
# A PR that closes a board task must also carry recorded Estimate and Actual
# hours before it lands; merge-gate.sh enforces that and explains any hold on
# the PR itself. PRs with no closing reference are unaffected.
#
# That gate needs the PROJECT_TOKEN secret, because the Actions GITHUB_TOKEN
# cannot read a user-owned ProjectV2 at all - the API reports NOT_FOUND rather
# than a permission error. PROJECT_TOKEN is a classic PAT owned by cleverClosure
# with two scopes:
#
#   repo           resolve the issue's card (the card is reached through the
#                  issue, and this repository is private)
#   read:project   read Estimate and Actual
#
# It has to be classic. Fine-grained tokens cannot reach projects owned by a
# user account at all - GitHub lists this as a known gap, and their Projects
# permission covers organization projects only. Classic scopes are coarse, so
# `repo` grants more than this job uses; the job only reads with it, and every
# mutation here still runs as GITHUB_TOKEN. Created 3 October 2026 with a
# 90-day expiry: when it lapses, task PRs hold with a comment that says so.
#
# Setting a board field fires no event, so a held PR is re-evaluated when its
# CI next completes: scripts/finish-task.sh re-runs CI after recording Actual,
# and the hold comment names the exact run to re-run after a change by hand.

name: Auto-merge

on:
  workflow_run:
    workflows: ["CI", "CodeQL"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  # For closing the linked issues after the merge. A merge made with the Actions
  # token leaves them open: every auto-merged task PR from #64 on did. This
  # permission alone does not change that - #93 merged with it granted and its
  # issue stayed open - so merge-gate.sh --close-linked closes them explicitly.
  issues: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Squash-merge when CI is green
    # Only successful CI runs, only PR runs (a push to main also runs CI, and
    # must not re-enter here), and only branches in this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # workflow_run always executes the default branch's copy of this workflow,
      # and checkout without a ref follows that same commit. The board gate
      # therefore runs trusted code, never the pull request's version of it -
      # which matters because this job holds write permissions.
      - name: Check out the board gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq 'map(select(.state == "open" and .base.ref == "main")) | .[0].number // empty')
          if [[ -z $pr ]]; then
            echo "No open pull request into main for $SHA; nothing to merge."
            exit 0
          fi
          echo "Candidate: PR #$pr at $SHA"

          # mergeStateStatus is computed lazily and reports UNKNOWN until GitHub
          # has finished; poll rather than guess. CLEAN is the only state that
          # means "mergeable AND every commit status passed" - UNSTABLE is the
          # state a failing check produces on an unprotected branch.
          state=""
          for attempt in $(seq 1 12); do
            read -r prstate draft merge_state mergeable head <<<"$(gh pr view "$pr" --repo "$REPO" \
              --json state,isDraft,mergeStateStatus,mergeable,headRefOid \
              --jq '[.state, .isDraft, .mergeStateStatus, .mergeable, .headRefOid] | @tsv')"

            if [[ $prstate != OPEN ]]; then
              echo "PR #$pr is $prstate; nothing to do."
              exit 0
            fi
            if [[ $head != "$SHA" ]]; then
              echo "PR #$pr has moved on ($head != $SHA); a newer CI run will handle it."
              exit 0
            fi
            if [[ $draft == true ]]; then
              echo "PR #$pr is a draft; leaving it for a human."
              exit 0
            fi

            state=$merge_state
            if [[ $merge_state != UNKNOWN && $mergeable != UNKNOWN ]]; then
              break
            fi
            echo "Merge state still being computed (attempt $attempt); waiting."
            sleep 10
          done

          echo "PR #$pr merge state: $state (mergeable: $mergeable)"
          case "$state" in
            CLEAN)
              ;;
            DIRTY)
              echo "PR #$pr conflicts with main; not merging."
              exit 0
              ;;
            UNSTABLE)
              echo "PR #$pr has a failing or incomplete check; not merging."
              exit 0
              ;;
            *)
              echo "PR #$pr is in state $state; not merging."
              exit 0
              ;;
          esac

          # The board gate runs last, once the PR is known to be mergeable, so a
          # PR that is conflicted or failing is never also told about its board
          # fields. A hold is a normal outcome and leaves this run green; the
          # gate explains itself on the PR, and the next CI run re-evaluates it.
          if ! NUMBER="$pr" REPOSITORY="$REPO" bash .github/workflows/merge-gate.sh; then
            echo "Board gate is holding PR #$pr; not merging."
            exit 0
          fi

          echo "Merging PR #$pr."
          gh pr merge "$pr" --repo "$REPO" --squash
          echo "Merged PR #$pr."

          # The merge does not close the issues it links when the Actions token
          # performs it, and an open issue keeps its card out of Done.
          NUMBER="$pr" REPOSITORY="$REPO" bash .github/workflows/merge-gate.sh --close-linked
