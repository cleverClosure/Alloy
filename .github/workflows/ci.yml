# Alloy lightweight continuous integration
# Author: Timur Isaev

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # ready_for_review is the default set plus one. Auto-merge only looks at a PR
    # when CI completes, and marking a draft ready does not run CI by default -
    # so #86, #88 and #90 sat green and unmerged until merged by hand, which also
    # walks around the board gate in auto-merge.yml.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # shfmt is pinned because the runner has none and Homebrew serves the
      # latest. 3.14 formats a heredoc inside an `if` differently from the 3.13
      # this tree is formatted with, so by October 2026 every PR failed lint
      # on spikes/M12-003/prototype/run_corpus.sh without a change to main.
      # The digest is the one GitHub publishes for the release asset. Installed
      # first, so the Homebrew step below finds it and skips shfmt.
      - name: Install pinned shfmt
        env:
          SHFMT_VERSION: v3.13.1
          SHFMT_SHA256: 9680526be4a66ea1ffe988ed08af58e1400fe1e4f4aef5bd88b20bb9b3da33f8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_darwin_arm64"
          echo "${SHFMT_SHA256}  $RUNNER_TEMP/bin/shfmt" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/bin/shfmt"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Install missing lint tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          formulas=()
          command -v clang-format >/dev/null || formulas+=(clang-format)
          command -v shellcheck >/dev/null || formulas+=(shellcheck)
          command -v shfmt >/dev/null || formulas+=(shfmt)
          command -v markdownlint-cli2 >/dev/null || formulas+=(markdownlint-cli2)
          command -v yamllint >/dev/null || formulas+=(yamllint)
          command -v swiftlint >/dev/null || formulas+=(swiftlint)
          command -v jq >/dev/null || formulas+=(jq)

          if ((${#formulas[@]})); then
            brew install "${formulas[@]}"
          fi

      - name: Lint
        run: tools/lint.sh

      - name: Title format self-test
        run: bash .github/workflows/title-format.sh --selftest

      - name: Task form self-test
        run: bash .github/workflows/task-form.sh --selftest

      # The merge gate is the one check that cannot be exercised by opening a
      # PR: workflow_run only ever runs the copy already on main, so a broken
      # gate would first be observed by it wrongly merging or wrongly holding
      # every task PR. Both self-tests are offline and stub every API call.
      - name: Merge gate self-test
        run: bash .github/workflows/merge-gate.sh --selftest

      - name: Merge gate end-to-end self-test
        run: bash .github/workflows/merge-gate-selftest.sh

      - name: DXMT install wiring self-test
        run: bash spikes/GFX-001/harness/dxmt-install.sh selftest

      # The release itself needs the lab's Wine build and cannot run here. What
      # can run anywhere is the proof that the bundle it makes is the source
      # that was built, on source trees whose right answer is known.
      - name: Release bundle self-test
        run: bash tools/release/make-release.sh --selftest

      # The production content store, not the ROLLBACK-001 prototype it replaced:
      # this step used to test the superseded copy while the library that ships
      # ran no checks at all.
      - name: Test production content store
        run: swift test --package-path runtime/content-store

      - name: Content store process-death fault matrix
        run: runtime/content-store/run-fault-matrix.sh

      # Counsel item 6: the shipped Steam posture is read-only discovery plus
      # user-driven actions in Steam's own UI (doc 18 section 9). The gate runs
      # against a synthetic library, so it needs no Steam install.
      - name: Steam automation gate
        run: spikes/STORE-001/steam-readonly/steam-automation-gate.sh

      - name: Steam automation gate selftest
        run: spikes/STORE-001/steam-readonly/gate-selftest.sh
